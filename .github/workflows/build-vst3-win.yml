name: Build Windows VST3

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-vst3:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.28.x"

      - name: Configure JUCE VST3 (x64)
        shell: cmd
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build Release VST3
        shell: cmd
        run: cmake --build build --config Release --parallel

      - name: Collect VST3 artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact_out | Out-Null
          Get-ChildItem -Path build -Filter "*.vst3" -Directory -Recurse | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination "artifact_out/$($_.Name)" -Recurse -Force
          }

      - name: Upload VST3 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HybridResonanceEQ-Windows-VST3
          path: artifact_out/
          if-no-files-found: error
