name: Build Windows VST3

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-vst3:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.28.x"

      - name: Configure JUCE VST3 (x64)
        shell: pwsh
        run: |
          cmake -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build Release VST3
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Collect VST3 artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact_out | Out-Null
          $vst3 = Get-ChildItem -Path build -Recurse -Directory -Filter "*.vst3" | Select-Object -First 1
          if (-not $vst3) {
            throw "No .vst3 bundle was produced!"
          }
          Copy-Item -Path $vst3.FullName -Destination "artifact_out\$($vst3.Name)" -Recurse -Force

      - name: Upload VST3 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HybridResonanceEQ-Windows-VST3
          path: artifact_out/*
